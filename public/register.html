<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Tag PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Pegawai</title>
    
    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Registrasi Pegawai</h1>
            <p class="text-xs text-slate-400 mt-1">Buat akun untuk mendapatkan QR Code Absensi</p>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-3.5">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">NIP (Nomor Induk Pegawai)</label>
                <input type="text" id="nip" placeholder="Contoh: 12345" required
                    class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Nama Lengkap</label>
                <input type="text" id="full_name" placeholder="Nama lengkap Anda" required
                    class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Email</label>
                <input type="email" id="email" placeholder="email@domain.com" required
                    class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">No. Telepon (Opsional)</label>
                <input type="tel" id="phone" placeholder="08123456789"
                    class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-3.5 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-user-check"></i> Daftar Sekarang
            </button>
        </form>

        <div class="text-center mt-5 pt-4 border-t border-slate-700/60">
            <p class="text-xs text-slate-400">Sudah punya akun? 
                <a href="/" class="text-blue-400 font-semibold hover:underline">Masuk di sini</a>
            </p>
        </div>
    </div>

    <!-- Main JavaScript -->
    <script>
        // ============================================================
        // SERVICE WORKER - PWA REGISTRATION
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ PWA Service Worker registered successfully!');
                        console.log('Scope:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ PWA Service Worker registration failed:', error);
                    });
            });
        }

        // ============================================================
        // REGISTER FUNCTIONALITY
        // ============================================================

        async function handleRegister(e) {
            e.preventDefault();
            
            // Ambil data dari form
            const payload = {
                nip: document.getElementById('nip').value.trim(),
                full_name: document.getElementById('full_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value
            };

            // Validasi tambahan
            if (payload.nip.length < 3) {
                alert('NIP minimal 3 karakter!');
                document.getElementById('nip').focus();
                return;
            }

            if (payload.password.length < 6) {
                alert('Password minimal 6 karakter!');
                document.getElementById('password').focus();
                return;
            }

            // Disable button untuk mencegah double submit
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

            try {
                const res = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (result.success) {
                    alert('✅ Registrasi Berhasil! Anda akan diarahkan ke Dashboard.');
                    // Redirect ke halaman utama dengan parameter NIP
                    window.location.href = `/?nip=${payload.nip}`;
                } else {
                    alert(`❌ Gagal: ${result.message}`);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-user-check"></i> Daftar Sekarang';
                }
            } catch (err) {
                console.error('Error registering user:', err);
                alert('❌ Terjadi kesalahan jaringan/server. Silakan coba lagi.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-check"></i> Daftar Sekarang';
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT: Enter to submit
        // ============================================================
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') {
                e.preventDefault();
                document.querySelector('form').dispatchEvent(new Event('submit'));
            }
        });

        // ============================================================
        // AUTO-FOCUS: Fokus ke field NIP saat halaman dimuat
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('nip').focus();
            console.log('🚀 Registrasi Pegawai page loaded successfully!');
        });

        // ============================================================
        // PREVENT FORM RESUBMISSION
        // ============================================================
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
    </script>
</body>
</html>
