<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Tag PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pegawai - Absensi Digital</title>
    
    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md">
        
        <!-- STEP 1: FORM INPUT NIP (TAMPIL AWAL) -->
        <div id="login-section" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-id-card text-2xl"></i>
                </div>
                <h1 class="text-xl font-bold text-white">Portal Absensi Pegawai</h1>
                <p class="text-xs text-slate-400 mt-1">Masukkan NIP untuk mengakses Kartu QR Absensi</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nomor Induk Pegawai (NIP)</label>
                    <input type="text" id="input-nip" placeholder="Masukkan NIP Anda..." required
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Dashboard
                </button>
            </form>
        </div>
        
        <div class="text-center mt-4 pt-3 border-t border-slate-700/60">
            <p class="text-xs text-slate-400">Belum punya akun? 
                <a href="/register.html" class="text-blue-400 font-semibold hover:underline">Daftar Akun Pegawai</a>
            </p>
        </div>

        <!-- STEP 2: DASHBOARD PEGAWAI (KARTU DIGITAL & HISTORY) -->
        <div id="dashboard-section" class="hidden space-y-4">
            
            <!-- Card Profil & QR -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
                
                <!-- Header Profil -->
                <div class="mb-4">
                    <span class="inline-block px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-[10px] font-semibold rounded-full border border-emerald-500/20 mb-2">
                        ● Pegawai Aktif
                    </span>
                    <h2 id="user-name" class="text-lg font-bold text-white tracking-wide"></h2>
                    <p id="user-nip" class="text-xs text-slate-400 font-mono mt-0.5"></p>
                </div>

                <!-- QR Code Box -->
                <div class="bg-white p-4 rounded-xl inline-block shadow-inner my-2 border-4 border-slate-700">
                    <div id="qrcode"></div>
                </div>
                <p class="text-[11px] text-slate-400 mt-2">
                    <i class="fa-solid fa-qrcode mr-1"></i> Tunjukkan QR ini ke petugas / scanner
                </p>
            </div>

            <!-- Card Riwayat Absensi -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
                <div class="flex items-center justify-between mb-3 border-b border-slate-700/60 pb-2">
                    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> Riwayat Absensi Terakhir
                    </h3>
                    <span class="text-[10px] text-slate-500">Max 10 Data</span>
                </div>

                <ul id="history-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- History item akan di-render di sini -->
                </ul>
            </div>

            <!-- Tombol Keluar -->
            <button onclick="logout()" 
                class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-white py-2 rounded-xl text-xs transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar 
            </button>
        </div>

    </div>

    <!-- Main JavaScript -->
    <script>
        // ============================================================
        // SERVICE WORKER - PWA REGISTRATION
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ PWA Service Worker registered successfully!');
                        console.log('Scope:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ PWA Service Worker registration failed:', error);
                    });
            });
        }

        // ============================================================
        // DASHBOARD FUNCTIONALITY
        // ============================================================
        
        // Cek jika NIP dikirim via parameter URL (misal: ?nip=12345)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const nipFromUrl = urlParams.get('nip');
            if (nipFromUrl) {
                document.getElementById('input-nip').value = nipFromUrl;
                fetchDashboardData(nipFromUrl);
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const nip = document.getElementById('input-nip').value.trim();
            if (nip) fetchDashboardData(nip);
        }

        async function fetchDashboardData(nip) {
            try {
                const res = await fetch(`/api/users/dashboard/${nip}`);
                const result = await res.json();

                if (!result.success) {
                    alert(result.message);
                    return;
                }

                const { user, attendances } = result.data;

                // Set Data User
                document.getElementById('user-name').innerText = user.full_name;
                document.getElementById('user-nip').innerText = `NIP: ${user.nip}`;

                // Generate QR Code
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: user.nip,
                    width: 150,
                    height: 150,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Render Riwayat Absensi
                const historyList = document.getElementById('history-list');
                if (attendances.length === 0) {
                    historyList.innerHTML = `
                        <li class="text-center py-4 text-xs text-slate-500 italic">
                            Belum ada catatan absensi.
                        </li>`;
                } else {
                    historyList.innerHTML = attendances.map(a => {
                        const date = new Date(a.scan_time);
                        const formattedDate = date.toLocaleDateString('id-ID', { 
                            day: 'numeric', 
                            month: 'short', 
                            year: 'numeric' 
                        });
                        const formattedTime = date.toLocaleTimeString('id-ID', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });

                        return `
                            <li class="flex items-center justify-between p-2.5 bg-slate-900/60 border border-slate-700/40 rounded-xl text-xs">
                                <div>
                                    <p class="font-medium text-slate-200">${formattedDate}</p>
                                    <p class="text-[10px] text-slate-400 font-mono">${formattedTime} WIB</p>
                                </div>
                                <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20 rounded-lg text-[10px]">
                                    ${a.status || 'Hadir'}
                                </span>
                            </li>
                        `;
                    }).join('');
                }

                // Switch Tampilan
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');

            } catch (err) {
                console.error('Error fetching dashboard data:', err);
                alert('Terjadi kesalahan saat mengambil data pegawai.');
            }
        }

        function logout() {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('input-nip').value = '';
            // Clear QR Code
            document.getElementById('qrcode').innerHTML = '';
        }

        // ============================================================
        // KEYBOARD SHORTCUT: Enter to login
        // ============================================================
        document.getElementById('input-nip').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin(e);
            }
        });

        console.log('🚀 Dashboard Pegawai loaded successfully!');
    </script>
</body>
</html>
