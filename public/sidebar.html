<script>
    // Skrip otomatis mendeteksi halaman aktif dan memberikan gaya menu aktif + garis kuning
    document.addEventListener("DOMContentLoaded", function() {
        const currentPage = window.location.pathname.split("/").pop();
        
        // Jika currentPage kosong (misal buka folder root), anggap dashboard
        const pageTarget = currentPage === "" ? "dashboard.html" : currentPage;

        document.querySelectorAll(".nav-link").forEach(link => {
            // Reset class ke default terlebih dahulu
            link.className = "nav-link flex items-center gap-3.5 px-4 py-3 rounded-xl hover:bg-white/5 text-gray-300 transition";
            
            // Hapus elemen garis kuning jika ada (untuk reset)
            const existingIndicator = link.querySelector('.absolute.left-0');
            if (existingIndicator) existingIndicator.remove();
            
            // Reset warna icon
            const icon = link.querySelector('i');
            if(icon) icon.classList.remove('text-yellow-400');

            // Terapkan style aktif jika cocok
            if (link.getAttribute("data-page") === pageTarget) {
                link.className = "nav-link relative flex items-center gap-3.5 px-4 py-3 rounded-xl bg-gradient-to-r from-white/10 to-transparent text-white font-semibold transition";
                
                // Tambahkan garis kuning
                const indicator = document.createElement('div');
                indicator.className = "absolute left-0 top-2 bottom-2 w-1.5 bg-yellow-400 rounded-r-full";
                link.prepend(indicator);
                
                // Ubah warna icon jadi kuning
                if(icon) icon.classList.add('text-yellow-400');
            }
        });
    });
</script>
